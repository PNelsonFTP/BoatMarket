name: boatscout
services:
  app:
    build:
      context: .
      target: ${BOATSCOUT_DOCKER_TARGET:-runtime}
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      DATABASE_URL: file:/app/data/boatscout.db
    volumes:
      - boatscout-data:/app/data
      - boatscout-config:/app/config
      - boatscout-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    build:
      context: .
      target: ${BOATSCOUT_DOCKER_TARGET:-runtime}
    init: true
    command: ["node", "--import", "tsx", "server/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/boatscout.db
    volumes:
      - boatscout-data:/app/data
      - boatscout-config:/app/config
      - boatscout-logs:/app/logs
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  boatscout-data:
  boatscout-config:
  boatscout-logs:
