name: Deploy reviewed BoatScout release
on:
  workflow_dispatch:
    inputs:
      review_hash:
        description: Exact SHA-256 printed by release prepare and approved locally
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.BOATSCOUT_ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Generate database client for type checking
        run: npx prisma generate
      - name: Verify the reviewed snapshot, source and SBOM provenance
        run: npm run release -- verify --review="$REVIEW_HASH"
        env:
          REVIEW_HASH: ${{ inputs.review_hash }}
      - name: Check types and unit/integration tests
        run: npm run typecheck && npm test
      - name: Build static website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_API_URL: ${{ vars.BOATSCOUT_API_URL }}
      - name: Verify matching build and emit release provenance
        run: npm run release -- verify --review="$REVIEW_HASH" --built=out
        env:
          REVIEW_HASH: ${{ inputs.review_hash }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy reviewed build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
